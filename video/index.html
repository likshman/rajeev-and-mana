<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="Rajeev &amp; Mana · Save the date">
<meta property="og:description" content="11 April 2027 · Dumaguete · Tap to watch">

<style>
  :root { --bg:#0c0a08; --cream:#f0e4d0; --gold:#d6b278; --dim:#cbb796; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--cream);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:var(--bg); }

  .screen { position:fixed; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px; transition:opacity .6s ease; }
  .k { letter-spacing:.35em; font-size:15px; color:var(--dim); }
  h1 { font-style:italic; font-weight:500; font-size:clamp(44px, 12vw, 76px); line-height:1.05; }
  .rule { width:120px; height:1px; background:var(--gold); margin:6px 0; }
  .when { color:var(--gold); font-size:20px; letter-spacing:.04em; }
  #start .top { text-shadow:0 1px 14px rgba(12,10,8,.75), 0 0 2px rgba(12,10,8,.5); }
  #start .when { color:var(--cream); }

  #start { justify-content:space-between;
    padding:calc(9vh + env(safe-area-inset-top)) 24px calc(7vh + env(safe-area-inset-bottom));
    background:
      linear-gradient(rgba(12,10,8,.55) 0%, rgba(12,10,8,.15) 35%, rgba(12,10,8,.1) 60%, rgba(12,10,8,.7) 100%),
      url("poster.jpg") center / cover no-repeat, var(--bg);
    cursor:pointer; }
  .top, .bottom { display:flex; flex-direction:column; align-items:center; gap:14px; }
  #go { display:flex; align-items:center; gap:12px; border:1px solid rgba(240,228,208,.6);
    background:rgba(12,10,8,.4); color:var(--cream); font:inherit; font-size:21px; letter-spacing:.08em;
    padding:14px 28px; border-radius:999px; cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #go .tri { width:0; height:0; border-left:13px solid var(--cream);
    border-top:8px solid transparent; border-bottom:8px solid transparent; }
  .hint { font-size:15px; color:var(--dim); font-style:italic; }

  #end { background:var(--bg); opacity:0; pointer-events:none; }
  #end.show { opacity:1; pointer-events:auto; }
  #end a { color:var(--cream); }
  .gone { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<video id="v" src="save-the-date.mp4" poster="poster.jpg" playsinline webkit-playsinline preload="auto"></video>

<div id="start" class="screen" role="button" aria-label="Play the save the date video">
  <div class="top">
    <div class="k">SAVE THE DATE</div>
    <h1>Rajeev &amp; Mana</h1>
    <div class="rule"></div>
    <div class="when">11 · 04 · 2027 &nbsp;·&nbsp; Dumaguete</div>
  </div>
  <div class="bottom">
    <button id="go" type="button"><span class="tri"></span>Play our video</button>
    <div class="hint">Sound on 🔊</div>
  </div>
</div>

<div id="end" class="screen" role="status" aria-live="polite">
  <div class="k">SAVE THE DATE</div>
  <h1>Rajeev &amp; Mana</h1>
  <div class="rule"></div>
  <p class="when">Opening our page in <span id="n">3</span>…</p>
  <a href="https://likshman.github.io/rajeev-and-mana/">Go now</a>
</div>

<script>
  var TARGET = "https://likshman.github.io/rajeev-and-mana/";
  var DELAY = 3; // seconds after the video ends
  var v = document.getElementById("v"),
      start = document.getElementById("start"),
      end = document.getElementById("end"),
      n = document.getElementById("n");

  // One tap starts the video with sound (browsers require a tap before playing audio).
  function begin() {
    v.muted = false;
    v.volume = 1;
    var p = v.play();
    start.classList.add("gone");
    if (p && p.catch) p.catch(function () { start.classList.remove("gone"); });
  }
  start.addEventListener("click", begin);

  // Tap the video to pause / resume.
  v.addEventListener("click", function () { v.paused ? v.play() : v.pause(); });

  v.addEventListener("ended", function () {
    end.classList.add("show");
    var left = DELAY;
    n.textContent = left;
    var t = setInterval(function () {
      left -= 1;
      if (left > 0) { n.textContent = left; return; }
      clearInterval(t);
      window.location.replace(TARGET);
    }, 1000);
  });
</script>
</body>
</html>
